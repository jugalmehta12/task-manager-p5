# =============================================================================
# Nginx configuration — Practical 11: Containerization
# =============================================================================
# Serves the Vite production build of the React frontend.
# Handles React Router's client-side navigation: any path that does not match
# a real file falls back to index.html so the SPA can handle routing itself.
# =============================================================================

server {
    listen 80;
    server_name localhost;

    # Serve files from the Vite build output directory
    root /usr/share/nginx/html;
    index index.html;

    # Handle static assets with cache headers
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # All other routes: serve index.html so React Router handles navigation.
    # Without this, refreshing /projects would return a 404 from Nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
